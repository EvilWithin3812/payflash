# Production overrides. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What changes compared with local development:
#   * Required secrets: the stack refuses to start until they are set (in a .env file or the environment).
#   * Only the web app (port 80) is published. Databases, Kafka, Redis, the gateway and the services are
#     reachable only inside the Docker network. Admin UIs bind to 127.0.0.1 (use an SSH tunnel).
#   * Demo shortcuts are off: no simulated top-up, no anonymous Grafana, no Swagger, 10% trace sampling.
#   * PRODUCTION=true: the app refuses to start if any demo-only setting slipped through.
#   * Redis requires a password. Emails go through a real SMTP provider. Backups use the real passwords.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  notifications-db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set NOTIFICATIONS_DB_PASSWORD}

  redis:
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  kafka:
    ports: !reset []

  mailpit:
    profiles: ["dev"]          # use a real SMTP provider in production (MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD)

  kafka-ui:
    profiles: ["dev"]

  app:
    ports: !reset []
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (base64, 32+ random bytes)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      PRODUCTION: "true"
      SIMULATED_TOPUP_ENABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      REQUIRE_VERIFIED_EMAIL: "true"
      API_DOCS_ENABLED: "false"
      TRACING_SAMPLING_PROBABILITY: "0.1"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://payflash.example.com}
      PUBLIC_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # Verification and password-reset emails.
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST (your SMTP provider)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, e.g. PayFlash <no-reply@your-domain.com>}

  notification-service:
    depends_on: !override
      notifications-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set NOTIFICATIONS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST (your SMTP provider)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      TRACING_SAMPLING_PROBABILITY: "0.1"

  backup:
    environment:
      PAYFLASH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set NOTIFICATIONS_DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}

  gateway:
    ports: !reset []
    environment:
      TRACING_SAMPLING_PROBABILITY: "0.1"

  web:
    ports: !override
      - "80:80"                # put TLS in front (Caddy, an AWS load balancer, or Cloudflare)

  zipkin:
    ports: !override
      - "127.0.0.1:9411:9411"

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    ports: !override
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
