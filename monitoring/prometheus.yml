# Prometheus scrapes every Spring Boot service's /actuator/prometheus endpoint inside the Docker network.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payflash-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8090"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8091"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
