# Serves the built React app and forwards API + WebSocket traffic to the API gateway.
# The browser sees a single origin (http://localhost:3000), so no CORS configuration is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;            # don't advertise the nginx version
    client_max_body_size 64k;     # the API takes small JSON bodies only

    # Security headers (CSP, framing, referrer) for every response. Strict-Transport-Security belongs on the
    # HTTPS proxy in front (see the Caddyfile in DEPLOY.md).
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket: needs the HTTP/1.1 upgrade headers and a long read timeout.
    location /ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routes (/sales/42, /orders, ...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
