# The whole PayFlash stack in Docker: the app plus every dependency.
#
#   Start everything (builds the images the first time):     docker compose up -d --build
#   Then open the web app:                                    http://localhost:3000
#   Grafana http://localhost:3001 · Zipkin http://localhost:9411 · Mailpit http://localhost:8025 · Kafka UI http://localhost:8085
#   Follow the app's logs:                                    docker compose logs -f app
#   Stop (data is kept):                                      docker compose down
#   Stop and wipe all data:                                   docker compose down -v
#
# Developing in IntelliJ instead? Run `docker compose stop app` and start PayFlashApplication there;
# it connects to these same containers through the published ports.
#
# Every value below is for LOCAL DEVELOPMENT only. Never reuse these passwords anywhere real.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflash
      POSTGRES_USER: payflash
      POSTGRES_PASSWORD: payflash
    ports:
      - "5433:5432"          # 5433 on the host, so it doesn't clash with a local PostgreSQL install
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflash -d payflash"]
      interval: 5s
      retries: 10

  # The notification service's own database (database-per-service: no shared tables with the core app).
  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5434:5432"
    volumes:
      - notificationsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Append-only file: flash-sale stock survives a Redis restart (the app can also rebuild it from Postgres).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Fake SMTP server: catches every email the app sends. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "1025:1025"
      - "8025:8025"

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # Containers use kafka:29092; the host (IntelliJ) uses localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # This check starts a small JVM, so poll quickly only while starting up, then every 30s.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      timeout: 15s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Daily dumps of both databases into ./backups on the host (kept 7 days). Copy them off the server too:
  # a backup on the same disk doesn't survive losing the disk. See DEPLOY.md, "Backups".
  backup:
    build: ./ops/backup
    image: payflash-backup:local
    environment:
      PAYFLASH_DB_HOST: postgres
      PAYFLASH_DB_NAME: payflash
      PAYFLASH_DB_USER: payflash
      PAYFLASH_DB_PASSWORD: payflash
      NOTIFICATIONS_DB_HOST: notifications-db
      NOTIFICATIONS_DB_NAME: notifications
      NOTIFICATIONS_DB_USER: notifications
      NOTIFICATIONS_DB_PASSWORD: notifications
      BACKUP_KEEP_DAYS: 7
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      notifications-db:
        condition: service_healthy

  # ---------------------------------------------------------------- application services

  # Core app: auth, wallet, payments, flash sales (modular monolith).
  app:
    build: .
    image: payflash-app:local
    ports:
      - "8090:8090"          # direct access for Swagger / IntelliJ comparisons; clients go through the gateway
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payflash
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Local admin account (needed to create flash sales). Override from your shell or a .env file.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@payflash.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password-1}
      # For the k6 load test set RATE_LIMIT_ENABLED=false (all its traffic comes from one IP) and
      # REQUIRE_VERIFIED_EMAIL=false (its thousands of buyers can't click email links).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-true}
      # Local demo: "Add money" works without Razorpay. The production override turns this off.
      SIMULATED_TOPUP_ENABLED: "true"
      # DEMO_MODE=true docker compose up -d: one-click demo logins and an always-live sale (see deploy/ORACLE.md)
      DEMO_MODE: ${DEMO_MODE:-false}
      # Account emails (verification, password reset) land in Mailpit: http://localhost:8025
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      PUBLIC_URL: http://localhost:3000
      # Optional Razorpay test-mode keys: put them in a .env file next to this one (it's git-ignored).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    mem_limit: 1g

  # Notification service: consumes wallet.transactions from Kafka, sends email, owns its own database.
  notification-service:
    build: ./services/notification-service
    image: payflash-notification-service:local
    environment:
      DB_URL: jdbc:postgresql://notifications-db:5432/notifications
      KAFKA_BOOTSTRAP: kafka:29092
      MAIL_HOST: mailpit
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      notifications-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    mem_limit: 512m

  # Spring Cloud Gateway: single entry point, routing, circuit breakers, request ids.
  gateway:
    build: ./services/api-gateway
    image: payflash-gateway:local
    ports:
      - "8088:8080"
    environment:
      CORE_SERVICE_URL: http://app:8090
      NOTIFICATION_SERVICE_URL: http://notification-service:8091
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      app:
        condition: service_healthy
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    mem_limit: 512m

  # React frontend (nginx) -> gateway. Open http://localhost:3000
  web:
    build: ./frontend
    image: payflash-web:local
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

  # ---------------------------------------------------------------- observability

  # Distributed tracing UI: follow one request across gateway -> app -> Kafka -> notification-service.
  zipkin:
    image: openzipkin/zipkin:3.5
    ports:
      - "9411:9411"
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus

  # Dashboards at http://localhost:3001 (anonymous read access locally; admin / admin to edit).
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payflash.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  notificationsdata:
  redisdata:
  kafkadata:
  prometheusdata:
  grafanadata:
